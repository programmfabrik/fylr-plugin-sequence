plugin:
  name: fylr-plugin-sequence
  version: 1
  displayname:
    de-DE: "Sequence Plugin"
    en-US: "Sequence Plugin"
  info:
    de-DE: |
      Füllt konfigurierte leere Felder in fylr-Datensätzen automatisch mit fortlaufenden Nummern. Geeignet zur Erzeugung laufender Kennungen, Inventarnummern oder ähnlicher Zähler beim Anlegen oder Aktualisieren von Datensätzen.

      - Sequenzen je Objecttype und Feld, formatiert über printf-artige Vorlagen (z. B. `ID_%04d`)
      - Getrennte Sequenzen je Feldwert, sodass die Nummerierung vom Objektinhalt abhängen kann
      - Pool-basierte Nummerierung mit Platzhaltern für Poolname, Referenz und Hierarchie, vererbt an untergeordnete Pools
      - Beschränkung auf neu angelegte Objekte sowie Offsets zur Auflösung von Kollisionen mit vorhandenen Werten
    en-US: |
      Automatically fills configured empty fields in fylr records with sequential numbers. Use it to generate running identifiers, inventory numbers, or similar counters as records are inserted or updated.

      - Configure sequences per objecttype and field, formatted with printf-style templates (e.g. `ID_%04d`)
      - Keep separate sequences per field value, so numbering can vary by object content
      - Define pool-based numbering with placeholders for pool name, reference, and hierarchy, inherited by child pools
      - Restrict filling to newly inserted objects, and use offsets to resolve collisions with existing values
  l10n: l10n/fylr-plugin-sequence.csv
  webfrontend:
    url: fylr-plugin-sequence.js

base_url_prefix: "webfrontend"

# callback registration in fylr
callbacks:
  db_pre_save:
    steps:
      - name: "automatic filling of emtpy fields with sequential numbers"
        callback: insert_sequence
    callbacks:
      insert_sequence:
        exec:
          service: python3
          commands:
            - prog: python3
              stdin:
                type: body
              stderr:
                type: body
              stdout:
                type: body
              args:
                - type: value
                  value: "%_exec.pluginDir%/server/main.py"

base_config:

  - name: sequence
    parameters:
      objecttype:
        type: text
        plugin_type: sequence_objecttype
        position: 0
      ref_field:
        type: text
        plugin_type: sequence_ref_field
        position: 1
      num_field:
        type: text
        plugin_type: sequence_num_field
        position: 2

  - name: objecttypes
    parameters:
      sequence_settings:
        type: table
        fields:
          - name: enabled
            type: bool
            default: true
            position: 0
          - name: update_objecttype
            type: text
            plugin_type: update_objecttype
            position: 1
          - name: update_column
            type: text
            plugin_type: update_column
            position: 2
          - name: template
            type: text
            position: 3
          - name: obj_field
            type: text
            plugin_type: obj_field
            position: 4
          - name: no_sequence_if_empty_field
            type: bool
            position: 5
          - name: start_offset
            default: 0
            type: int
            position: 6
          - name: only_insert
            type: bool
            position: 7
        position: 0
